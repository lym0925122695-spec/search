<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 수시 입시결과 검색기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 20px; background-color: #f9f9f9; }
        h1 { color: #333; text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 20px; font-size: 14px; }
        
        /* 다중 검색창 디자인 */
        .search-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
            margin-bottom: 20px; 
            flex-wrap: wrap;
        }
        input[type="text"] { 
            width: 250px; 
            padding: 12px 20px; 
            font-size: 16px; 
            border: 2px solid #4CAF50; 
            border-radius: 8px; 
            outline: none; 
            transition: box-shadow 0.2s;
        }
        input[type="text"]:focus { box-shadow: inset 0 0 5px rgba(76, 175, 80, 0.3); }
        button { 
            padding: 12px 30px; 
            font-size: 16px; 
            border: 2px solid #4CAF50; 
            background-color: #4CAF50; 
            color: white; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            transition: background 0.2s; 
        }
        button:hover { background-color: #45a049; }
        
        .loading-wrap { text-align: center; margin-bottom: 20px; }
        .loading { font-size: 16px; color: #4CAF50; font-weight: bold; }
        
        .table-wrapper { overflow-x: auto; max-height: 650px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; background: #fff; text-align: left; }
        th, td { padding: 12px 15px; text-align: center; border-bottom: 1px solid #ddd; font-size: 14px; white-space: nowrap; }
        th { background-color: #4CAF50; color: white; position: sticky; top: 0; z-index: 10; font-weight: bold; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        tr:hover { background-color: #f1f3f5; }
        .no-result { text-align: center; padding: 30px; color: #999; font-size: 16px; }
        .initial-msg { text-align: center; padding: 50px; color: #666; font-size: 16px; }
    </style>
</head>
<body>

    <h1>2025 학년도 수시 입시결과 조회</h1>
    <div class="subtitle">대교협 발표자료 기반</div>
    
    <div class="search-container">
        <input type="text" id="univInput" placeholder="대학명 (예: 고려대, 가천대)">
        <input type="text" id="majorInput" placeholder="학과명 (예: 간호, 컴퓨터)">
        <button onclick="filterTable()">검색</button>
    </div>
    
    <div class="loading-wrap">
        <div id="loadingText" class="loading">데이터(2만여 개)를 불러오는 중입니다. 잠시만 기다려주세요...</div>
    </div>

    <div class="table-wrapper" id="tableWrapper" style="display:none;">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>학교</th>
                    <th>중심전형</th>
                    <th>전형명</th>
                    <th>모집단위(학과명)</th>
                    <th>모집인원</th>
                    <th>경쟁률</th>
                    <th>충원순위</th>
                    <th>교과 등급<br>(50% cut)</th>
                    <th>교과 등급<br>(70% cut)</th>
                    <th>반영된 교과목</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr id="initialRow"><td colspan="10" class="initial-msg">데이터 로딩이 완료되었습니다. 위 검색창에 대학명이나 학과명을 입력하고 검색을 눌러주세요.</td></tr>
            </tbody>
        </table>
    </div>
    
    <div id="noData" class="no-result" style="display:none;">검색 조건에 맞는 결과가 없습니다.</div>

    <script>
        // ⚠️ 선생님의 API 키를 반드시 아래에 붙여넣어 주세요!
        const API_KEY = 'AIzaSyBXkK8CUCBRX9PqOxghIYm3f2xGBge9f7k'; 
        const SPREADSHEET_ID = '1-ZMGUJQKPShhYGql1BEhJDxcxF-rVrjtLhrI-t2KtPA';
        // H, I, M열 데이터를 포함할 수 있도록 범위를 지정합니다.
        const RANGE = '2025 수시입결!A3:W'; 
        const apiUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(RANGE)}?key=${API_KEY}`;
        
        let allData = [];

        function handleEnter(e) {
            if (e.key === 'Enter') filterTable();
        }
        document.getElementById('univInput').addEventListener('keypress', handleEnter);
        document.getElementById('majorInput').addEventListener('keypress', handleEnter);

        async function fetchSheetData() {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const rows = data.values;
                let processedData = [];
                let lastUniversity = "-";

                const getVal = (row, idx) => {
                    return row[idx] ? row[idx].replace(/\n|\r/g, ' ').trim() : '-';
                };

                rows.forEach(row => {
                    if (!row || row.length === 0) return;

                    let currentUniv = getVal(row, 0);

                    if (currentUniv === "" || currentUniv === "-") {
                        currentUniv = lastUniversity;
                    } else {
                        lastUniversity = currentUniv; 
                    }

                    // 💡 알려주신 엑셀 기준(H열, I열, M열)으로 인덱스 번호를 정확히 수정했습니다.
                    let refinedRow = [
                        currentUniv,           // A열 (0): 학교
                        getVal(row, 1),        // B열 (1): 중심전형
                        getVal(row, 2),        // C열 (2): 전형명
                        getVal(row, 3),        // D열 (3): 모집단위(학과명)
                        getVal(row, 4),        // E열 (4): 모집인원
                        getVal(row, 5),        // F열 (5): 경쟁률
                        getVal(row, 6),        // G열 (6): 충원순위
                        getVal(row, 7),        // H열 (7): 50% cut (수정완료)
                        getVal(row, 8),        // I열 (8): 70% cut (수정완료)
                        getVal(row, 12)        // M열 (12): 반영 교과목 (수정완료)
                    ];

                    if (refinedRow[0] !== '-' && refinedRow[3] !== '-' && refinedRow[3] !== '모집단위') {
                        processedData.push(refinedRow);
                    }
                });

                allData = processedData;

                document.getElementById('loadingText').innerText = `총 ${allData.length.toLocaleString()}건의 데이터 준비 완료! 대학명 또는 학과명을 검색해주세요.`;
                document.getElementById('tableWrapper').style.display = 'block';
                
            } catch (error) {
                console.error('API 로드 오류:', error);
                document.getElementById('loadingText').innerText = `API 호출 중 오류가 발생했습니다. API 키를 확인해주세요.`;
                document.getElementById('loadingText').style.color = 'red';
            }
        }

        function displayData(data) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            if (data.length === 0) {
                document.getElementById('noData').style.display = 'block';
                document.getElementById('resultTable').style.display = 'none';
                return;
            } else {
                document.getElementById('noData').style.display = 'none';
                document.getElementById('resultTable').style.display = 'table';
            }

            data.forEach(rowData => {
                const tr = document.createElement('tr');
                
                rowData.forEach(colText => {
                    const td = document.createElement('td');
                    td.innerText = colText;
                    tr.appendChild(td);
                });

                tableBody.appendChild(tr);
            });
        }

        function filterTable() {
            const univQuery = document.getElementById('univInput').value.toLowerCase().trim();
            const majorQuery = document.getElementById('majorInput').value.toLowerCase().trim();
            
            if (!univQuery && !majorQuery) {
                alert("대학명이나 학과명 중 하나 이상을 입력해주세요!");
                return;
            }

            const filtered = allData.filter(row => {
                const university = row[0] ? row[0].toLowerCase() : '';
                const major = row[3] ? row[3].toLowerCase() : '';
                
                const univMatch = univQuery === '' || university.includes(univQuery);
                const majorMatch = majorQuery === '' || major.includes(majorQuery);
                
                return univMatch && majorMatch; 
            });

            displayData(filtered);
            
            let searchMsg = '';
            if (univQuery && majorQuery) searchMsg = `'${univQuery}'의 '${majorQuery}'`;
            else if (univQuery) searchMsg = `'${univQuery}'`;
            else if (majorQuery) searchMsg = `'${majorQuery}'`;
            
            document.getElementById('loadingText').innerText = `${searchMsg} 검색 결과: 총 ${filtered.length.toLocaleString()}건`;
            document.getElementById('loadingText').style.color = '#333';
        }

        window.onload = fetchSheetData;
    </script>
</body>
</html>
